# SQL Server GIẢ LẬP AVEVA/Wonderware Historian — CHỈ DÙNG ĐỂ PHÁT TRIỂN CỤC BỘ.
# Mật khẩu bên dưới là mặc định dev-only, KHÔNG dùng cho hệ thống thật; ghi đè bằng biến môi trường.
#   SCADA_FAKE_SA_PASSWORD  (mặc định VrgScada!Dev2026)
#   SCADA_FAKE_RO_PASSWORD  (mặc định ScadaRo!Dev2026) — mật khẩu login chỉ-đọc scada_ro, do init.sql đọc
#   SCADA_FAKE_IMAGE        (mặc định mssql/server:2022-latest; nếu crash trên Apple Silicon thử 2019-latest)
name: vrg-scada-fake

services:
  scada-fake:
    image: mcr.microsoft.com/${SCADA_FAKE_IMAGE:-mssql/server:2022-latest}
    platform: linux/amd64          # SQL Server không có bản arm64 → chạy qua Rosetta trên Apple Silicon
    container_name: vrg-scada-fake
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SCADA_FAKE_SA_PASSWORD:-VrgScada!Dev2026}
      TZ: Asia/Ho_Chi_Minh         # GETDATE() theo giờ Việt Nam như máy SCADA thật của nhà máy
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14330:1433"     # cổng host 14330 (cổng dự án đang dùng: 8390/5390/5433)
    volumes:
      - ./init.sql:/init/init.sql:ro
    healthcheck:
      # tools18 (2022) hoặc tools (2019) — lấy cái nào có
      test:
        - CMD-SHELL
        - >-
          S=/opt/mssql-tools18/bin/sqlcmd; [ -x $$S ] || S=/opt/mssql-tools/bin/sqlcmd;
          $$S -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
