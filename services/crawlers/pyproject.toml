[project]
name = "vrg-caosu-crawlers"
version = "0.1.0"
description = "Crawler chi so san cao su (VRG) - ANRPC, SGX, SHFE, FX..."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pdfplumber>=0.11",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
