[project]
name = "vrg-caosu-api"
version = "0.2.92"
description = "FastAPI gateway — AI Du bao Gia Cao su (VRG)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.32",
    "playwright>=1.60.0",
    "pypdf>=6.13.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "openai>=1.50",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
