name: vrg-caosu

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: vrg
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: vrg_caosu
    ports:
      - "5432:5432"
    volumes:
      - db-data:/home/postgres/pgdata/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrg -d vrg_caosu"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../../apps/api
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://vrg:${DB_PASSWORD:-changeme}@db:5432/vrg_caosu
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ../../apps/web
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  db-data:
