name: vrg

# Triển khai VRG bằng image GỘP đã push lên GitLab registry (web tĩnh + FastAPI trong 1 container).
# Dùng:
#   docker login registry.gitlab.com
#   cp deployment/vrg.env.example deployment/.env   # rồi điền giá trị thật
#   VRG_TAG=0.1.0 docker compose --env-file deployment/.env -f deployment/vrg_deploy.yaml up -d
#
# Schema DB lấy từ infra/db/init (chạy 1 lần khi volume db trống).

x-app-env: &app-env
  APP_ENV: '${APP_ENV:-production}'
  WEB_DIST_DIR: /app/web_dist
  DATABASE_URL: 'postgresql://vrg:${DB_PASSWORD:-changeme}@db:5432/vrg_caosu'
  JWT_SECRET: '${JWT_SECRET}'
  JWT_EXPIRE_MINUTES: '${JWT_EXPIRE_MINUTES:-720}'
  ADMIN_USERNAME: '${ADMIN_USERNAME:-admin}'
  ADMIN_PASSWORD: '${ADMIN_PASSWORD}'

services:
  app:
    image: 'registry.gitlab.com/flowbot1/flowbot/vrg:${VRG_TAG}'
    environment: *app-env
    volumes:
      # File ghi runtime → giữ qua các lần deploy. THIẾU volume ở đây = MẤT DỮ LIỆU khi recreate
      # container, vì /app/data nằm trong lớp ghi tạm. Chỉ mount thư mục do người dùng tạo ra;
      # phần baked sẵn trong image (bulletin-assets, weekly-report-assets) để nguyên cho image mới
      # cập nhật được.
      # ★ Chứng từ đơn vị upload (hợp đồng · phiếu xuất kho · hoá đơn) — KHÔNG tái tạo được.
      - contract-files:/app/data/unit-daily-contracts
      # ★ File/hình đính kèm trong Hỗ trợ & Thông báo — cũng KHÔNG tái tạo được.
      - support-files:/app/data/support-files
      - bulletin-out:/app/data/bulletins
      - bulletin-custom:/app/data/bulletin-assets/custom
      - weekly-out:/app/data/weekly-reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:8000/health'')"']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: vrg
      POSTGRES_PASSWORD: '${DB_PASSWORD:-changeme}'
      POSTGRES_DB: vrg_caosu
    volumes:
      - db-data:/home/postgres/pgdata/data
      - ../infra/db/init:/docker-entrypoint-initdb.d:ro   # extensions + schema (chạy khi volume trống)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vrg -d vrg_caosu']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cổng ra DUY NHẤT tới SCADA nhà máy (AVEVA Historian SQL Server) qua Tailscale — chỉ container này
  # vào tailnet, host và các dự án khác trên Dokploy KHÔNG. Chế độ egress proxy của image chính thức:
  # app gọi `scada-gw:1433` → chuyển tiếp tới máy SCADA được share (TS_TAILNET_TARGET_IP). Không mở
  # cổng ra ngoài, không gắn dokploy-network. Lần đầu: `docker logs <container>` có link đăng nhập —
  # đăng nhập bằng tài khoản ĐÃ NHẬN share (không dùng auth key có tag: máy gắn tag không vào được
  # máy được share), rồi tắt Key expiry của máy `vrg-scada-gw` trên trang quản trị Tailscale.
  scada-gw:
    image: 'tailscale/tailscale:${TS_IMAGE_TAG:-stable}'
    hostname: scada-gw
    environment:
      TS_HOSTNAME: vrg-scada-gw
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'false'                                  # egress proxy bắt buộc mạng kernel
      TS_TAILNET_TARGET_IP: '${SCADA_TAILNET_IP:-100.123.202.42}'
      TS_AUTH_ONCE: 'true'
    volumes:
      - scada-gw-state:/var/lib/tailscale                    # giữ danh tính — restart không đăng nhập lại
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  db-data:
  contract-files:
  support-files:
  bulletin-out:
  bulletin-custom:
  weekly-out:
  scada-gw-state:
